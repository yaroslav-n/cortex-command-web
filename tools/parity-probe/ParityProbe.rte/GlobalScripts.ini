AddGlobalScript = GlobalScript
	PresetName = Parity Probe
	Description = Writes the loaded Scene's terrain materials to Userdata/ParityProbe.bin for comparing builds.
	ScriptPath = ParityProbe.rte/ParityProbe.lua
	LuaClassName = ParityProbeScript

AddGlobalScript = GlobalScript
	PresetName = Parity Timeline
	Description = Records actors, object counts and a terrain sample at fixed simulation steps to Userdata/ParityTimeline.txt.
	ScriptPath = ParityProbe.rte/ParityTimeline.lua
	LuaClassName = ParityTimelineScript

AddGlobalScript = GlobalScript
	PresetName = Parity Defeat
	Description = Destroys the human players' brains at step 60 and records the activity's response to Userdata/ParityEndgame.txt.
	ScriptPath = ParityProbe.rte/ParityEndgame.lua
	LuaClassName = ParityDefeatScript
	LateUpdate = 0

AddGlobalScript = GlobalScript
	PresetName = Parity Victory
	Description = Destroys every non-human-team actor at step 60 and records the activity's response to Userdata/ParityEndgame.txt.
	ScriptPath = ParityProbe.rte/ParityEndgame.lua
	LuaClassName = ParityVictoryScript
	LateUpdate = 0

AddGlobalScript = GlobalScript
	PresetName = Parity Screen
	Description = Pins the camera on the player's brain, saves a screenshot at step 300 (ScreenShots/ParityScreen_*.png) and writes Userdata/ParityScreen.txt when done.
	ScriptPath = ParityProbe.rte/ParityScreen.lua
	LuaClassName = ParityScreenScript
	LateUpdate = 1
