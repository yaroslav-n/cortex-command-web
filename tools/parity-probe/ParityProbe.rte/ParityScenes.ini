// A Scene built exactly as the Scene Editor's "Create New" builds one with its
// default choices (Alezer Canyon terrain; Default Front, Clouds Layer A and Editor
// Background), and a scripted activity that does nothing, so the editor's view can
// be photographed in the original, where the editor itself runs no scripts.

AddScene = Scene
	PresetName = Parity Editor Scene
	Terrain = SLTerrain
		CopyOf = Alezer Canyon Terrain
	AddBackgroundLayer = SLBackground
		CopyOf = Default Front
	AddBackgroundLayer = SLBackground
		CopyOf = Clouds Layer A
	AddBackgroundLayer = SLBackground
		CopyOf = Editor Background

AddActivity = GAScripted
	PresetName = Parity Blank
	Description = Does nothing; hosts the probe scripts on a Scene.
	SceneName = Parity Editor Scene
	ScriptPath = ParityProbe.rte/ParityBlank.lua
	LuaClassName = ParityBlank
	TeamOfPlayer1 = 0
	MinTeamsRequired = 1
	DefaultFogOfWar = 0
