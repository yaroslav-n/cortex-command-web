<script>
// The start screen. Nothing of the game is downloaded until the player asks for it:
// the page checks that this browser can run the game, then offers "Play Game", which
// loads the game and starts it as soon as it has loaded. The first time that is a
// download; the browser keeps the game for later visits.
// body[data-state] says where it is, for people and for tools/run-checks.mjs:
// checking, unsupported, offer-play, loading, running, failed or closed.
// See notes/files-and-saves.md.
const status = document.getElementById('status');
const button = document.getElementById('start');
const errors = document.getElementById('errors');
const canvas = document.getElementById('canvas');
const query = new URLSearchParams(location.search);
// What the page shows if the game fails: the first lines that look like errors, which
// the rest of a failure would otherwise push out, and the last lines before it.
const recentOutput = [];
const firstErrors = [];
// The game is linked with ABORTING_MALLOC: when the heap cannot grow, the thread that
// needed it stops with "Aborted(OOM)" (on the page's own thread, onAbort gets "OOM").
let outOfMemory = false;
if (query.has('thread-debug')) Error.stackTraceLimit = 64;

function setState(state) {
  document.body.dataset.state = state;
  document.body.classList.toggle('running', state === 'running');
}

function offer(label, onclick) {
  button.textContent = label;
  button.hidden = false;
  button.disabled = false;
  button.onclick = onclick;
}

function logLine(line, error = false) {
  const text = String(line).replace(/\x1b\[[0-9;]*m/g, '');
  recentOutput.push(text);
  if (recentOutput.length > 60) recentOutput.shift();
  if (firstErrors.length < 20 && /error|exception|abort|assert|cannot enlarge|out of memory|heap grew|lua memory/i.test(text)) firstErrors.push(text);
  if (text.includes('Aborted(OOM)')) {
    outOfMemory = true;
    if (document.body.dataset.state === 'failed') status.textContent = 'The game ran out of memory.';
  }
  (error ? console.error : console.log)(line);
  if (error && String(line).includes('Blocking on the main thread') && query.has('thread-debug')) console.log('Blocking call stack: ' + new Error().stack);
}

function failure(message) {
  // A failure is often reported more than once (the error and then the abort); the
  // first report decides what the page says, unless a later one shows that memory ran out.
  outOfMemory = outOfMemory || String(message) === 'OOM';
  if (outOfMemory) {
    status.textContent = 'The game ran out of memory.';
  } else if (document.body.dataset.state !== 'failed') {
    status.textContent = document.body.dataset.state === 'running' ? 'The game stopped with an error.' : 'The game could not start.';
  }
  setState('failed');
  const first = firstErrors.length ? 'First errors:\n' + firstErrors.join('\n') + '\n\nLast output:\n' : '';
  // wasmMemory is the game's heap (cortex.js), there once the game has loaded.
  const heap = typeof wasmMemory === 'object' ? `\nHeap: ${Math.round(wasmMemory.buffer.byteLength / 1048576)} MB of 4096 MB` : '';
  errors.textContent = first + recentOutput.join('\n') + '\n' + String(message) + heap;
  console.error('Game failure: ' + String(message));
  button.hidden = true;
}

// What an uncaught error says. A C++ exception nothing caught arrives as a bare
// WebAssembly.Exception; the game is linked with EXCEPTION_STACK_TRACES, which gives it
// the exception's type and what() as message, and the stack it was thrown from.
function describeError(error) {
  if (typeof WebAssembly.Exception === 'function' && error instanceof WebAssembly.Exception) {
    const [type, what] = Array.isArray(error.message) ? error.message : [];
    return `Uncaught C++ exception${type ? ' ' + type : ''}${what ? ': ' + what : ''}\n${error.stack || ''}`;
  }
  return (error && (error.stack || error.message)) || String(error);
}

const megabytes = (bytes) => Math.round(bytes / 1e6);
const loading = () => document.body.dataset.state === 'loading';

// Loading must never stop without saying so. Every step reports news: the program's and
// the package's downloads every piece that arrives, a download's retries, and Emscripten
// each step main waits for, as it starts and as it ends, and its setStatus. With none for
// QUIET_MS the page gives up and says to reload. A download that gets no byte for
// STALL_MS is tried again, after a pause that doubles up to 8 s, from where it stopped,
// and given up after TRIES failures in a row, so it gives news more often than that.
// ?load-timeout=<ms> (tools/run-checks.mjs) sets QUIET_MS and scales the rest with it.
const QUIET_MS = Number(query.get('load-timeout')) || 30000;
const STALL_MS = QUIET_MS * 2 / 3;
const TRIES = 5;
const retryPause = (failures) => Math.min(2 ** (failures - 1), 8) * QUIET_MS / 30;
let lastNews = 0;
const news = () => { lastNews = performance.now(); };

// The data package, cortex.data: all of Data but the sounds (CMakeLists.txt). Emscripten's
// file packager still makes every one of its files, in its own order, which is the order
// the engine reads a module's INI files in (DataModule::FindAndRead lists a directory as
// it is); the page only brings the bytes, through the packager's getPreloadedPackage.
// cortex.js asks for them as it starts, long before they are here, so it is given the
// buffer they arrive in: the packager's files are views into it (it owns the buffer), and
// main waits on a run dependency until every byte is here and checked. The bytes come from
// Cache Storage, which keeps them under their SHA-256, or are downloaded, resumed where a
// failure stopped them, and checked against cortex.data.json (their size and SHA-256,
// written by the build) before anything uses or keeps them. See notes/files-and-saves.md.
const PACKAGE = 'cortex.data';
const PACKAGE_CACHE = 'cortex-data';
let packageBytes = null;
let packageReady = null; // true once packageBytes hold the package, false if it could not be had

// The buffer is made by whichever asks first: the loader, which has read the package's size
// from cortex.data.json, or the packager, which knows it from cortex.js. Two sizes mean the
// two files are from different builds.
function packageBuffer(size, source) {
  packageBytes ??= new Uint8Array(size);
  if (packageBytes.length !== size) {
    throw new Error(`cortex.js and cortex.data.json are from different versions of the game (${source} says the data has ${size} bytes, the other ${packageBytes.length})`);
  }
  return packageBytes;
}

const showDownload = (done, total, note = '') => {
  news();
  if (loading()) status.textContent = `Downloading the game: ${megabytes(done)} of ${megabytes(total)} MB${note}`;
};

// Runs attempt(signal, alive) until it succeeds. The attempt calls alive() for every piece of
// data, alive(true) for one that got further than any attempt before; after STALL_MS without
// one it is aborted. A failed attempt is tried again after a pause, and the last error is
// thrown after TRIES failures in a row; an attempt that got further starts the count again,
// one that only got as far again does not (a download that starts over each time, and
// breaks off at the same place, must end). Once the page has given up on loading, so does
// this.
async function withRetries(attempt, onRetry) {
  for (let failures = 0; ; ) {
    const controller = new AbortController();
    let timer;
    let progressed = false;
    const alive = (further = false) => {
      if (!loading()) controller.abort(new Error('loading has stopped'));
      progressed ||= further;
      news();
      clearTimeout(timer);
      timer = setTimeout(() => controller.abort(new Error(`no data for ${STALL_MS / 1000} seconds`)), STALL_MS);
    };
    try {
      alive();
      return await attempt(controller.signal, alive);
    } catch (error) {
      failures = progressed ? 1 : failures + 1;
      if (failures === TRIES || !loading()) throw new Error(`${error.message || error} (${failures} tries)`);
      console.error(`${error.message || error}; trying again`);
    } finally {
      clearTimeout(timer);
      controller.abort(); // whatever is left of this attempt's request
    }
    onRetry?.();
    await new Promise((resolve) => setTimeout(resolve, retryPause(failures)));
  }
}

// Reads a response's body into packageBytes from offset on, and returns where it ended.
async function readBody(response, offset, progress) {
  const reader = response.body.getReader();
  for (;;) {
    const { done, value } = await reader.read();
    if (done) return offset;
    if (offset + value.length > packageBytes.length) throw new Error(`${PACKAGE} is longer than the ${packageBytes.length} bytes expected`);
    packageBytes.set(value, offset);
    offset += value.length;
    progress(offset);
  }
}

// Downloads the package into packageBytes. After a failure it asks for the rest only
// (Range): a server that answers 206 sends it, one that answers 200 sends it all again.
// If-Range makes sure the rest is of the same file.
function downloadPackage() {
  const size = packageBytes.length;
  let received = 0; // what the next attempt need not ask for again
  let furthest = 0; // the most of it any attempt has had
  let resumable = false;
  let validator = null;
  return withRetries(async (signal, alive) => {
    // Every byte came, on a connection that then stopped instead of ending: the hash decides.
    if (received === size) return;
    showDownload(received, size);
    const headers = received ? { Range: `bytes=${received}-`, ...(validator && { 'If-Range': validator }) } : {};
    // Cache Storage keeps the package; the HTTP cache would only keep a second copy.
    const response = await fetch(PACKAGE, { cache: 'no-store', headers, signal });
    if (response.status === 206 && !response.headers.get('Content-Range')?.startsWith(`bytes ${received}-`)) {
      received = 0;
      throw new Error(`${PACKAGE}: the server sent another range than the one asked for`);
    } else if (response.status !== 206) {
      if (response.status !== 200) throw new Error(`${PACKAGE}: ${response.status} ${response.statusText}`.trim());
      received = 0;
      // A compressed response's length and ranges are not the package's.
      resumable = !response.headers.get('Content-Encoding');
      const length = response.headers.get('Content-Length');
      if (resumable && length !== null && Number(length) !== size) throw new Error(`${PACKAGE} has ${length} bytes, not the ${size} of this version of the game`);
      const etag = response.headers.get('ETag');
      validator = etag && !etag.startsWith('W/') ? etag : response.headers.get('Last-Modified');
    }
    const end = await readBody(response, received, (offset) => {
      if (resumable) received = offset;
      alive(offset > furthest);
      furthest = Math.max(furthest, offset);
      showDownload(offset, size);
    });
    if (end !== size) throw new Error(`the download of ${PACKAGE} ended after ${end} of ${size} bytes`);
  }, () => showDownload(received, size, ' (trying again…)'));
}

async function sha256(bytes) {
  const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
  return Array.from(digest, (byte) => byte.toString(16).padStart(2, '0')).join('');
}

// Takes a cached copy that is whole and right; drops any other.
async function readCachedPackage(cache, key, expected) {
  const cached = await cache.match(key).catch(() => undefined);
  if (!cached) return false;
  try {
    if ((await readBody(cached, 0, news)) === expected.size && (await sha256(packageBytes)) === expected.sha256) return true;
    console.error(`The kept copy of ${PACKAGE} is damaged; downloading it again`);
  } catch (error) {
    console.error(`Could not read the kept copy of ${PACKAGE}: ${error}`);
  }
  await cache.delete(key).catch(() => {});
  return false;
}

// Until this page brought the package itself, Emscripten's preload cache kept it in a
// database of its own, which nothing reads now. Only that one goes: the saves are in the
// databases named after their directories (/Userdata, /Mods, /ScreenShots).
async function dropPreloadCache() {
  if (!(await indexedDB.databases()).some(({ name }) => name === 'EM_PRELOAD_CACHE')) return;
  await new Promise((done) => {
    const request = indexedDB.deleteDatabase('EM_PRELOAD_CACHE');
    request.onsuccess = request.onerror = request.onblocked = done;
  });
}

// Keeps the checked package for later visits in place of what earlier versions of the game
// kept, which goes first, to make room for it. The copy is taken now, while the bytes are
// the checked ones (once main runs, the package's files, views into them, could be written
// to), into a Blob, which the browser writes off this thread: a body streamed from here
// would be written only as fast as the loading engine lets this thread run, and was still
// unfinished, and lost, when the page was closed as the menu appeared.
function keepPackage(cache, key, earlierDropped) {
  const copy = new Response(new Blob([packageBytes]), { headers: { 'Content-Type': 'application/octet-stream' } });
  const current = new URL(key, location.href).href;
  earlierDropped
    .then(() => cache.keys())
    .then((requests) => Promise.all(requests.filter((request) => request.url !== current).map((request) => cache.delete(request))))
    .then(() => cache.put(key, copy))
    .catch((error) => console.error(`Could not keep ${PACKAGE} for the next visit: ${error}`));
}

async function loadPackage() {
  const expected = await withRetries(async (signal) => {
    const response = await fetch('cortex.data.json', { cache: 'no-cache', signal });
    if (!response.ok) throw new Error(`cortex.data.json: ${response.status} ${response.statusText}`.trim());
    return response.json();
  });
  packageBuffer(expected.size, 'cortex.data.json');
  const cache = typeof caches === 'undefined' ? null : await caches.open(PACKAGE_CACHE).catch(() => null);
  const key = `${PACKAGE}?sha256=${expected.sha256}`;
  const cached = cache !== null && (await readCachedPackage(cache, key, expected));
  if (!cached) {
    // A download resumed from another version of the file than it began with, where If-Range
    // could not tell, is caught here; the whole of it is downloaded once more.
    for (let whole = 0; ; whole++) {
      await downloadPackage();
      if (loading()) status.textContent = 'Loading…';
      const actual = await sha256(packageBytes);
      if (actual === expected.sha256) break;
      if (whole) throw new Error(`what arrived is not this version's ${PACKAGE} (SHA-256 ${actual.slice(0, 12)}…, expected ${expected.sha256.slice(0, 12)}…)`);
      console.error(`${PACKAGE} arrived damaged; downloading it again`);
    }
  }
  const earlierDropped = dropPreloadCache().catch(() => {});
  if (cache && !cached) keepPackage(cache, key, earlierDropped);
}

// The program, cortex.wasm, fetched and compiled as it arrives, as Emscripten does, but by
// the page (Module.instantiateWasm), so that its download reports news too: a returning
// player whose package is kept still downloads a new program after an update, and on a
// slow link that must not look like a stall. The response is split in two (clone): the
// page counts the pieces of one, the compiler reads the other. Both are the fetched
// response, whose compiled code the browser keeps for the next visit; it would not keep
// that of a response the page made up (notes/files-and-saves.md).
async function instantiateProgram(imports) {
  const response = await fetch('cortex.wasm');
  if (!response.ok) throw new Error(`${response.status} ${response.statusText}`.trim());
  const compiled = response.clone();
  const pieces = response.body.getReader();
  (async () => { while (!(await pieces.read()).done) news(); })().catch(() => {});
  // Only a response that says it is application/wasm can be compiled while it arrives.
  const type = (compiled.headers.get('Content-Type') || '').split(';')[0].trim().toLowerCase();
  return type === 'application/wasm' ? WebAssembly.instantiateStreaming(compiled, imports)
    : WebAssembly.instantiate(await compiled.arrayBuffer(), imports);
}

var Module = {
  canvas,
  noInitialRun: true,
  threadDiagnostics: query.has('thread-debug'),
  graphicsDiagnostics: query.has('graphics-debug'),
  perfDiagnostics: query.has('perf-debug'),
  serialLoops: query.has('serial-loops'),
  print: (line) => logLine(line),
  printErr: (line) => logLine(line, true),
  // Emscripten's own steps after the package ("Running...").
  setStatus: () => {
    news();
    if (loading()) status.textContent = 'Loading…';
  },
  // Each step main waits for (the program, the thread pool, the saves, the sound list, the
  // package) as it starts and as it ends.
  monitorRunDependencies: news,
  instantiateWasm: (imports, receive) => {
    instantiateProgram(imports).then(({ instance, module }) => receive(instance, module), (error) => {
      if (loading()) failure(`Could not load cortex.wasm: ${error.message || error}. Reload the page to try again.`);
    });
    return {};
  },
  getPreloadedPackage: (name, size) => {
    try {
      return packageBuffer(size, 'cortex.js').buffer;
    } catch (error) {
      failure(`${error.message}. Reload the page to try again.`);
      return new ArrayBuffer(size);
    }
  },
  // main waits for the package, which is not let through once the page has given up on
  // loading; nor does main start if the page gives up after that (startGame).
  preRun: [() => {
    Module.addRunDependency('cortex-data');
    packageReady.then((ready) => ready && loading() && Module.removeRunDependency('cortex-data'));
  }],
  onAbort: failure,
  onRuntimeInitialized: startGame,
  onExit: (code) => {
    if (code === 0 && Module.returnToStartScreen) {
      (Module.persistSaves ? Module.persistSaves() : Promise.resolve()).then(() => location.reload());
      return;
    }
    setState('closed');
    status.textContent = code === 0 ? 'Game closed.' : 'Game exited with code ' + code;
    offer('Play again', () => location.reload());
  },
};

function load() {
  setState('loading');
  button.disabled = true;
  status.textContent = 'Loading…';
  news();
  // Time the page did not run is not silence: nothing could report news in it. A tick that
  // comes much later than asked for means the computer slept (on some systems the page's
  // clock runs on meanwhile) or the page was held up, and that gap is left out. A hidden
  // tab's timers can be held back to one a minute while its downloads still report news,
  // so there only a gap of more than 90 s is left out.
  let lastTick = performance.now();
  const watchdog = setInterval(() => {
    const now = performance.now();
    if (now - lastTick > (document.hidden ? 90000 : 5000)) lastNews = Math.min(now, lastNews + (now - lastTick));
    lastTick = now;
    if (!loading()) clearInterval(watchdog);
    else if (now - lastNews > QUIET_MS) failure(`Loading made no progress for ${QUIET_MS / 1000} seconds. Reload the page to try again.`);
  }, Math.min(1000, QUIET_MS / 4));
  packageReady = loadPackage().then(() => true, (error) => {
    if (loading()) failure(`Could not download the game data: ${error.message || error}. Reload the page to try again.`);
    return false;
  });
  const script = document.createElement('script');
  script.src = 'cortex.js';
  script.onerror = () => failure('Could not load cortex.js');
  document.body.appendChild(script);
}

function startGame() {
  // The page gave up on loading (no news, a promise nothing handled) after the package was
  // let through, while main still waited for another step, which then came: main does not
  // start, nor does what would follow it, the sounds' download (a postRun of
  // runtime/sound-files.js; Emscripten runs Module.postRun right after this).
  if (!loading()) {
    Module.postRun = [];
    return;
  }
  setState('running');
  button.disabled = true;
  canvas.focus();
  const dump = query.get('dump-scene');
  const world = query.get('dump-world');
  const simulate = query.get('simulate');
  const parallel = query.get('parallel');
  const activity = query.get('simulate-activity');
  const argv = activity ? ['-simulate-activity', activity, simulate || '600', ...(parallel ? [parallel] : [])]
    : simulate ? ['-simulate-tutorial', simulate, ...(parallel ? [parallel] : [])]
    : world ? ['-dump-scene-world', world]
    : dump ? ['-dump-scene-preview', dump]
    : query.has('debug') ? ['-cout'] : [];
  try {
    const running = Module.callMain(argv);
    if (running && running.catch) running.catch((error) => failure(describeError(error)));
  } catch (error) {
    failure(describeError(error));
  }
}

// The strip under the game: links, and how to give the game the whole screen, Ctrl+F.
// The game's area goes fullscreen, not the page, so the strip is not shown there, and
// Esc leaves as usual. SDL takes any fullscreen change on the page for its own window
// going fullscreen and then ignores resizes (Emscripten_HandleFullscreenChange), which
// would keep the game at its old size; kept from SDL, the change reaches it as a resize
// and the game's resolution follows (notes/display.md).
const game = document.getElementById('game');
for (const type of ['fullscreenchange', 'webkitfullscreenchange']) game.addEventListener(type, (event) => event.stopPropagation());
document.getElementById('fullscreen-hint').hidden = !document.fullscreenEnabled;

// Outside fullscreen, Ctrl+F is the page's: neither the browser's find nor the game sees
// it, since this listener captures on the window, ahead of SDL's there. F is the key that
// types f, or, on a layout whose letters are not Latin, the key in F's place. In
// fullscreen the key is the game's again: in its default mouse-and-keyboard controls
// Left Ctrl crouches and F picks up. The repeats of an F the page took are the page's
// too, or SDL would take the first of them for a press (notes/display.md).
const isCtrlF = (event) => event.ctrlKey && !event.altKey && !event.metaKey &&
  (/^[a-z]$/i.test(event.key) ? event.key.toLowerCase() === 'f' : event.code === 'KeyF');
let takenKey = '';
window.addEventListener('keydown', (event) => {
  if (!event.repeat) takenKey = document.fullscreenEnabled && !document.fullscreenElement && isCtrlF(event) ? event.code : '';
  if (!takenKey || event.code !== takenKey) return;
  event.preventDefault();
  event.stopImmediatePropagation();
  if (!event.repeat) game.requestFullscreen().catch(() => {});
}, true);

// Mods, from the strip's "Mods" (specs/mods.md). As it starts, the engine unpacks each .zip
// in /Mods (PresetMan::FindAndExtractZippedModules) and loads every Name.rte folder there
// that its Mod Manager has not turned off. The page puts a mod's .zip into, and takes a mod
// out of, the IndexedDB store where IDBFS keeps /Mods (runtime/filesystem.js). It writes the
// store itself, so it can before the game has started as well as while it runs: the game's
// journal (runtime/persistence-journal.js) writes only files the game changed and deletes
// nothing else, so what the page adds or removes stays that way. A change applies when the
// game next starts. See notes/files-and-saves.md.
const MODS = '/Mods';
const MODS_STORE = 'FILE_DATA'; // IDBFS.DB_STORE_NAME
const IDBFS_VERSION = 21; // IDBFS.DB_VERSION (Emscripten's libidbfs.js); opening with another fails
const FILE_MODE = 0o100666; // what IDBFS stores for a file the game wrote

const whenDone = (request) => new Promise((resolve, reject) => {
  request.onsuccess = request.oncomplete = () => resolve(request.result);
  request.onerror = request.onabort = () => reject(request.error || new Error('the browser\'s storage refused'));
});

function openMods() {
  const request = indexedDB.open(MODS, IDBFS_VERSION);
  // As IDBFS makes it, for a browser the game has never run in.
  request.onupgradeneeded = () => {
    const store = request.result.objectStoreNames.contains(MODS_STORE) ? request.transaction.objectStore(MODS_STORE) : request.result.createObjectStore(MODS_STORE);
    if (!store.indexNames.contains('timestamp')) store.createIndex('timestamp', 'timestamp', { unique: false });
  };
  return whenDone(request);
}

// What /Mods holds: mods (Name.rte folders), and .zip files the game has yet to unpack.
async function listMods() {
  const db = await openMods();
  try {
    const keys = await whenDone(db.transaction(MODS_STORE).objectStore(MODS_STORE).getAllKeys());
    const names = new Set(keys.map((key) => String(key).slice(MODS.length + 1).split('/')[0]).filter((name) => /\.(rte|zip)$/.test(name)));
    return [...names].sort((a, b) => a.localeCompare(b));
  } finally {
    db.close();
  }
}

async function changeMods(change) {
  const db = await openMods();
  try {
    const transaction = db.transaction(MODS_STORE, 'readwrite');
    change(transaction.objectStore(MODS_STORE));
    await whenDone(transaction);
  } finally {
    db.close();
  }
}

const removeFromStore = (store, path) => {
  store.delete(path);
  store.delete(IDBKeyRange.bound(path + '/', path + '/\uffff'));
};

// The names of the files in a zip, from its central directory, or null if it is not a zip
// the page can read (the engine's minizip reads the same directory).
function zipNames(bytes) {
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const decoder = new TextDecoder();
  // The end record is 22 bytes, after the directory, and may be followed by a comment.
  for (let end = bytes.length - 22; end >= 0 && end >= bytes.length - 22 - 0xffff; end--) {
    if (view.getUint32(end, true) !== 0x06054b50) continue;
    const names = [];
    for (let entry = 0, at = view.getUint32(end + 16, true); entry < view.getUint16(end + 10, true); entry++) {
      if (at + 46 > end || view.getUint32(at, true) !== 0x02014b50) return null;
      const length = view.getUint16(at + 28, true);
      names.push(decoder.decode(bytes.subarray(at + 46, at + 46 + length)));
      at += 46 + length + view.getUint16(at + 30, true) + view.getUint16(at + 32, true);
    }
    return names;
  }
  return null;
}

// Puts a mod's .zip into /Mods and returns the mods (Name.rte) it holds. A mod of the same
// name is replaced: its files go, so none of the old version's are left beside the new.
async function installMod(file) {
  const bytes = new Uint8Array(await file.arrayBuffer());
  const names = zipNames(bytes);
  if (!names) throw new Error(`${file.name} is not a zip file.`);
  // The engine unpacks each file to Mods/ plus its name in the zip, and loads Name.rte/Index.ini.
  const mods = [...new Set(names.map((name) => /^([^/]+\.rte)\/Index\.ini$/.exec(name)?.[1]).filter(Boolean))];
  if (!mods.length) {
    // The browser's files are case sensitive, where Windows' are not.
    const index = names.find((name) => /\.rte\/index\.ini$/i.test(name));
    throw new Error(index && /\/.*\//.test(index)
      ? `${file.name} has its mod inside another folder (${index.split('/')[0]}); the game needs the .rte folder at the top of the zip.`
      : index ? `${file.name} has ${index}, where the game needs ${index.split('/')[0]}/Index.ini, spelled just so.`
      : `${file.name} has no mod in it: the game needs a folder whose name ends in .rte, with an Index.ini in it, at the top of the zip.`);
  }
  // Named after its mods, which the list shows until the game unpacks it. Only a name ending
  // in .zip is unpacked (System::s_ZippedModulePackageExtension).
  const stored = `${MODS}/${mods.join(' + ')}.zip`;
  await changeMods((store) => {
    for (const mod of mods) removeFromStore(store, `${MODS}/${mod}`);
    store.put({ timestamp: new Date(), mode: FILE_MODE, contents: bytes }, stored);
  });
  return mods;
}

const modsButton = document.getElementById('mods');
const modsPanel = document.getElementById('mods-panel');
const modList = document.getElementById('mod-list');
const modMessage = document.getElementById('mod-message');
const modFile = document.getElementById('mod-file');
const modRestart = document.getElementById('mod-restart');
// Whether the game has started, and a change waits for its next start.
const gameStarted = () => !['checking', 'unsupported', 'offer-play'].includes(document.body.dataset.state);

function tellMods(text, error = false) {
  modMessage.textContent = text;
  modMessage.classList.toggle('error', error);
}

async function showModList() {
  let mods;
  try {
    mods = await listMods();
  } catch (error) {
    tellMods(`Could not read the installed mods: ${error.message || error}`, true);
    return;
  }
  modList.replaceChildren(...mods.map((mod) => {
    const item = document.createElement('li');
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = mod.replace(/\.zip$/, '');
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'quiet';
    remove.textContent = 'Remove';
    remove.onclick = () => modAction(async () => {
      await changeMods((store) => removeFromStore(store, `${MODS}/${mod}`));
      return `Removed ${mod.replace(/\.zip$/, '')}.` + (gameStarted() ? ' The game goes on without it the next time it starts.' : '');
    });
    if (mod.endsWith('.zip')) {
      const note = document.createElement('small');
      note.textContent = 'unpacked when the game starts';
      name.append(note);
    }
    item.append(name, remove);
    return item;
  }));
  if (!mods.length) {
    const none = document.createElement('li');
    none.className = 'none';
    none.textContent = 'No mods installed.';
    modList.append(none);
  }
}

// Runs an install or a removal, says how it went, and shows the list as it now is.
async function modAction(action) {
  for (const button of modsPanel.querySelectorAll('button')) button.disabled = true;
  try {
    tellMods(await action());
    if (gameStarted()) modRestart.hidden = false;
  } catch (error) {
    tellMods(error.message || String(error), true);
  } finally {
    for (const button of modsPanel.querySelectorAll('button')) button.disabled = false;
    await showModList();
  }
}

function showMods(open) {
  modsPanel.hidden = !open;
  modsButton.setAttribute('aria-expanded', String(open));
  if (open) {
    showModList();
  } else if (document.body.dataset.state === 'running') {
    canvas.focus();
  }
}

// A click on "Mods" leaves the keyboard with the game, and keys typed in the panel are the
// panel's alone: SDL listens for keys on the window, and would take them too.
modsButton.addEventListener('mousedown', (event) => event.preventDefault());
modsButton.onclick = () => showMods(modsPanel.hidden);
for (const type of ['keydown', 'keyup', 'keypress']) {
  modsPanel.addEventListener(type, (event) => {
    event.stopPropagation();
    if (type === 'keydown' && event.key === 'Escape') showMods(false);
  });
}
document.addEventListener('pointerdown', (event) => {
  if (!modsPanel.hidden && !modsPanel.contains(event.target) && !modsButton.contains(event.target)) showMods(false);
});
document.getElementById('mod-close').onclick = () => showMods(false);
document.getElementById('mod-install').onclick = () => modFile.click();
modFile.onchange = () => {
  const file = modFile.files[0];
  modFile.value = '';
  if (!file) return;
  modAction(async () => {
    const mods = await installMod(file);
    const list = mods.join(', ');
    return gameStarted() ? `Installed ${list}. The game loads ${mods.length > 1 ? 'them' : 'it'} the next time it starts.`
      : `Installed ${list}. The game loads ${mods.length > 1 ? 'them' : 'it'} when it starts.`;
  });
};
// The game reads mods only as it starts. What it has written is kept first, as when the
// player quits (Module.onExit), but a page whose game has stopped does not wait on it.
modRestart.onclick = async () => {
  modRestart.disabled = true;
  if (document.body.dataset.state === 'running' && Module.persistSaves) {
    await Promise.race([Module.persistSaves(), new Promise((resolve) => setTimeout(resolve, 5000))]);
  }
  location.reload();
};

window.addEventListener('error', (event) => failure(event.error ? describeError(event.error) : event.message));
// A promise that failed with nothing to handle it: while the game loads, that is why it
// will not start. Once it runs, one is not the game's end, and the console has it.
window.addEventListener('unhandledrejection', (event) => {
  if (loading()) failure(describeError(event.reason));
});
if (Module.threadDiagnostics) setInterval(() => console.log('Engine stage: ' + Module.engineStage + ' visits=' + Module.engineStageVisits), 5000);

if (!self.crossOriginIsolated) {
  setState('unsupported');
  status.textContent = 'This page cannot run the game: it must be served with cross-origin isolation (the Cross-Origin-Opener-Policy and Cross-Origin-Embedder-Policy headers).';
} else if (typeof WebAssembly.Suspending !== 'function') {
  setState('unsupported');
  status.textContent = 'This browser cannot run the game: it needs WebAssembly JSPI (Chrome 137 or newer).';
} else {
  setState('offer-play');
  offer('Play Game', load);
}
</script></body></html>
