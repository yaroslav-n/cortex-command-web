<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cortex Command</title><style>
html,body{margin:0;min-height:100%;background:#000;color:#eac557;font-family:system-ui,sans-serif}
body{overflow:hidden}
#game{position:fixed;left:0;top:0;right:0;bottom:50px;background:#000}#game:fullscreen{bottom:0}
canvas{display:block;width:100%;height:100%;outline:none;image-rendering:pixelated}
#launch{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#090b10;z-index:2;padding:24px}
#bar{position:fixed;left:0;right:0;bottom:0;height:50px;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;gap:20px;background:#000;color:#888;font-size:13px}
#bar a{display:flex;align-items:center;gap:8px;min-width:0;color:#aaa;text-decoration:none}#bar a:hover{color:#eac557}
#bar svg{width:16px;height:16px;flex:none;fill:currentColor}#credit{margin-right:auto}#credit span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#repo{padding:6px;margin-right:-6px}#repo svg{width:18px;height:18px}
#fullscreen-hint{white-space:nowrap}kbd{font:inherit;color:#ccc;padding:1px 5px;border:1px solid #444;border-radius:3px}
@media (max-width:700px){#fullscreen-hint{display:none}}
h1{font-size:32px;font-weight:650;letter-spacing:3px;margin-bottom:8px}p{color:#ccc;font-size:14px;max-width:34em;margin-left:auto;margin-right:auto}
button{background:#eac557;color:#17130a;border:0;padding:14px 32px;border-radius:4px;font-size:16px;cursor:pointer;margin-top:16px}button:disabled{opacity:.4;cursor:wait}
#errors{color:#ffb9b9;white-space:pre-wrap;max-width:80vw;font:13px monospace}#status:empty,#errors:empty{display:none}body.running #launch{display:none}
</style></head><body data-state="checking">
<div id="game">
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="launch"><h1>CORTEX COMMAND</h1><p id="status"></p><button id="start" hidden></button><pre id="errors"></pre></div>
</div>
<div id="bar">
<a id="credit" href="https://github.com/cortex-command-community/Cortex-Command-Community-Project" target="_blank" rel="noopener"><svg viewBox="0 0 16 16" aria-hidden="true"><path id="github-mark" fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><span>Based on Cortex Command Community Project</span></a>
<span id="fullscreen-hint">Open fullscreen by pressing <kbd>Ctrl</kbd> + <kbd>F</kbd></span>
<a id="repo" href="https://github.com/yaroslav-n/cortex-command-web" target="_blank" rel="noopener" title="This port on GitHub" aria-label="This port on GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><use href="#github-mark"/></svg></a>
</div>
<script>
// The start screen. Nothing of the game is downloaded until the player asks for it:
// the page checks that this browser can run the game, then offers "Play Game", which
// loads the game and starts it as soon as it has loaded. The first time that is a
// download; the browser keeps the game for later visits.
// body[data-state] says where it is, for people and for tools/run-checks.mjs:
// checking, unsupported, offer-play, loading, running, failed or closed.
// See notes/files-and-saves.md.
const status = document.getElementById('status');
const button = document.getElementById('start');
const errors = document.getElementById('errors');
const canvas = document.getElementById('canvas');
const query = new URLSearchParams(location.search);
// What the page shows if the game fails: the first lines that look like errors, which
// the rest of a failure would otherwise push out, and the last lines before it.
const recentOutput = [];
const firstErrors = [];
if (query.has('thread-debug')) Error.stackTraceLimit = 64;

function setState(state) {
  document.body.dataset.state = state;
  document.body.classList.toggle('running', state === 'running');
}

function offer(label, onclick) {
  button.textContent = label;
  button.hidden = false;
  button.disabled = false;
  button.onclick = onclick;
}

function logLine(line, error = false) {
  const text = String(line).replace(/\x1b\[[0-9;]*m/g, '');
  recentOutput.push(text);
  if (recentOutput.length > 60) recentOutput.shift();
  if (firstErrors.length < 20 && /error|exception|abort|assert|cannot enlarge|out of memory/i.test(text)) firstErrors.push(text);
  (error ? console.error : console.log)(line);
  if (error && String(line).includes('Blocking on the main thread') && query.has('thread-debug')) console.log('Blocking call stack: ' + new Error().stack);
}

function failure(message) {
  // A failure is often reported more than once (the error and then the abort); the
  // first report decides what the page says.
  if (document.body.dataset.state !== 'failed') {
    status.textContent = document.body.dataset.state === 'running' ? 'The game stopped with an error.' : 'The game could not start.';
  }
  setState('failed');
  const first = firstErrors.length ? 'First errors:\n' + firstErrors.join('\n') + '\n\nLast output:\n' : '';
  errors.textContent = first + recentOutput.join('\n') + '\n' + String(message);
  button.hidden = true;
}

const megabytes = (bytes) => Math.round(bytes / 1e6);

var Module = {
  canvas,
  noInitialRun: true,
  threadDiagnostics: query.has('thread-debug'),
  graphicsDiagnostics: query.has('graphics-debug'),
  perfDiagnostics: query.has('perf-debug'),
  serialLoops: query.has('serial-loops'),
  print: (line) => logLine(line),
  printErr: (line) => logLine(line, true),
  // Emscripten reports the data package's download as "Downloading data... (done/total)".
  setStatus: (text) => {
    if (document.body.dataset.state !== 'loading') return;
    const progress = /\((\d+)\/(\d+)\)/.exec(text || '');
    status.textContent = progress ? `Downloading the game: ${megabytes(progress[1])} of ${megabytes(progress[2])} MB` : 'Loading…';
  },
  onAbort: failure,
  onRuntimeInitialized: startGame,
  onExit: (code) => {
    if (code === 0 && Module.returnToStartScreen) {
      (Module.persistSaves ? Module.persistSaves() : Promise.resolve()).then(() => location.reload());
      return;
    }
    setState('closed');
    status.textContent = code === 0 ? 'Game closed.' : 'Game exited with code ' + code;
    offer('Play again', () => location.reload());
  },
};

function load() {
  setState('loading');
  button.disabled = true;
  status.textContent = 'Loading…';
  const script = document.createElement('script');
  script.src = 'cortex.js';
  script.onerror = () => failure('Could not load cortex.js');
  document.body.appendChild(script);
}

function startGame() {
  setState('running');
  button.disabled = true;
  canvas.focus();
  const dump = query.get('dump-scene');
  const world = query.get('dump-world');
  const simulate = query.get('simulate');
  const parallel = query.get('parallel');
  const activity = query.get('simulate-activity');
  const argv = activity ? ['-simulate-activity', activity, simulate || '600', ...(parallel ? [parallel] : [])]
    : simulate ? ['-simulate-tutorial', simulate, ...(parallel ? [parallel] : [])]
    : world ? ['-dump-scene-world', world]
    : dump ? ['-dump-scene-preview', dump]
    : query.has('debug') ? ['-cout'] : [];
  try {
    const running = Module.callMain(argv);
    if (running && running.catch) running.catch((error) => failure(error.stack || error));
  } catch (error) {
    failure(error.stack || error);
  }
}

// The strip under the game: links, and how to give the game the whole screen, Ctrl+F.
// The game's area goes fullscreen, not the page, so the strip is not shown there, and
// Esc leaves as usual. SDL takes any fullscreen change on the page for its own window
// going fullscreen and then ignores resizes (Emscripten_HandleFullscreenChange), which
// would keep the game at its old size; kept from SDL, the change reaches it as a resize
// and the game's resolution follows (notes/display.md).
const game = document.getElementById('game');
for (const type of ['fullscreenchange', 'webkitfullscreenchange']) game.addEventListener(type, (event) => event.stopPropagation());
document.getElementById('fullscreen-hint').hidden = !document.fullscreenEnabled;

// Outside fullscreen, Ctrl+F is the page's: neither the browser's find nor the game sees
// it, since this listener captures on the window, ahead of SDL's there. F is the key that
// types f, or, on a layout whose letters are not Latin, the key in F's place. In
// fullscreen the key is the game's again: in its default mouse-and-keyboard controls
// Left Ctrl crouches and F picks up. The repeats of an F the page took are the page's
// too, or SDL would take the first of them for a press (notes/display.md).
const isCtrlF = (event) => event.ctrlKey && !event.altKey && !event.metaKey &&
  (/^[a-z]$/i.test(event.key) ? event.key.toLowerCase() === 'f' : event.code === 'KeyF');
let takenKey = '';
window.addEventListener('keydown', (event) => {
  if (!event.repeat) takenKey = document.fullscreenEnabled && !document.fullscreenElement && isCtrlF(event) ? event.code : '';
  if (!takenKey || event.code !== takenKey) return;
  event.preventDefault();
  event.stopImmediatePropagation();
  if (!event.repeat) game.requestFullscreen().catch(() => {});
}, true);

window.addEventListener('error', (event) => failure(event.message));
if (Module.threadDiagnostics) setInterval(() => console.log('Engine stage: ' + Module.engineStage + ' visits=' + Module.engineStageVisits), 5000);

if (!self.crossOriginIsolated) {
  setState('unsupported');
  status.textContent = 'This page cannot run the game: it must be served with cross-origin isolation (the Cross-Origin-Opener-Policy and Cross-Origin-Embedder-Policy headers).';
} else if (typeof WebAssembly.Suspending !== 'function') {
  setState('unsupported');
  status.textContent = 'This browser cannot run the game: it needs WebAssembly JSPI (Chrome 137 or newer).';
} else {
  setState('offer-play');
  offer('Play Game', load);
}
</script></body></html>
