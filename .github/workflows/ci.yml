name: Build and check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Runs on main deploy, so they go one at a time, in order; the others run freely.
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'deploy' || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The Emscripten SDK and CMake, installed by tools/setup-toolchains.sh.
      - uses: actions/cache@v4
        with:
          path: toolchains
          key: toolchains-${{ runner.os }}-${{ hashFiles('tools/setup-toolchains.sh') }}

      - name: Install toolchains
        run: tools/setup-toolchains.sh

      - name: Build the game and the test programs
        run: ./build.sh --target checks

      # Headless Chrome on a runner has no sound card; the audio checks need an output
      # device, which a PulseAudio null sink provides.
      - name: Start a virtual audio device
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1

      - name: Run the checks
        run: |
          NODE=$(ls -d toolchains/emsdk/node/*/bin/node | tail -1)
          "$NODE" tools/run-checks.mjs --chrome "$(command -v google-chrome)"

      # Every check passed: main goes to https://yaroslav.au/cortex-command/
      # (notes/hosting.md). Wrangler runs on the Emscripten SDK's Node.
      - name: Deploy to yaroslav.au/cortex-command
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PATH="$PWD/$(dirname "$(ls -d toolchains/emsdk/node/*/bin/node | tail -1)"):$PATH"
          deploy/deploy.sh
